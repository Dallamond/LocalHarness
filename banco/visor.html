<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco de pruebas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --fondo: #f6f2ea; --tarjeta: #fcfcfb; --borde: #e6dfd2; --tinta: #1f1b16; --tinta-2: #57524a; --tinta-3: #8a8378;
  --rejilla: #ece6da; --acento: #c2562b; --bien: #2e7d4f; --mal: #b3402e; --aviso: #a86b00; --chip: #efe8dc;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --fondo: #141210; --tarjeta: #1a1a19; --borde: #2e2a25; --tinta: #f3eee6; --tinta-2: #c3c2b7; --tinta-3: #8d877c;
    --rejilla: #2a2723; --acento: #e07a4f; --bien: #6cc092; --mal: #e57c69; --aviso: #e0a640; --chip: #26231f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fondo: #141210; --tarjeta: #1a1a19; --borde: #2e2a25; --tinta: #f3eee6; --tinta-2: #c3c2b7; --tinta-3: #8d877c;
  --rejilla: #2a2723; --acento: #e07a4f; --bien: #6cc092; --mal: #e57c69; --aviso: #e0a640; --chip: #26231f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fondo); color: var(--tinta); font: 15px/1.5 Figtree, system-ui, sans-serif; }
.pagina { max-width: 1240px; margin: 0 auto; padding: 28px 16px 64px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
h2 { font-size: 17px; margin: 0 0 12px; }
.sub { color: var(--tinta-2); margin: 4px 0 0; max-width: 70ch; }
.grupos { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
.grupo { border: 1px solid var(--borde); background: var(--tarjeta); color: var(--tinta); border-radius: 999px;
  padding: 7px 14px; font: inherit; cursor: pointer; }
.grupo[aria-pressed="true"] { background: var(--tinta); color: var(--fondo); border-color: var(--tinta); }
.grupo small { color: inherit; opacity: .7; margin-left: 6px; }
.tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
.ficha { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: start; }
.ficha p { margin: 0; color: var(--tinta-2); max-width: 80ch; }
.boton { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--borde); border-radius: 999px;
  padding: 6px 12px; color: var(--tinta); text-decoration: none; background: var(--chip); font: inherit; font-size: 14px;
  cursor: pointer; white-space: nowrap; }
.boton:hover { border-color: var(--tinta-3); }
.boton.principal { background: var(--acento); border-color: var(--acento); color: #fff; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--tinta-3); font-size: 13px; padding: 6px 8px; border-bottom: 1px solid var(--borde); }
td { padding: 10px 8px; border-bottom: 1px solid var(--rejilla); vertical-align: middle; }
tr.fila { cursor: pointer; }
tr.fila:hover td { background: var(--fondo); }
tr.fila.elegida td { background: color-mix(in srgb, var(--acento) 9%, transparent); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.nota { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.muestra { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 8px; vertical-align: -1px; }
.nombre { font-weight: 600; }
.desc { color: var(--tinta-3); font-size: 13px; max-width: 46ch; }
.chip { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12.5px; background: var(--chip); color: var(--tinta-2); white-space: nowrap; }
.chip.integrado { color: var(--bien); } .chip.mal { color: var(--mal); } .chip.vivo { color: var(--acento); }
.chip.vivo::before { content: "● "; animation: latido 1.4s infinite; }
@keyframes latido { 50% { opacity: .25; } }
.grafica { position: relative; }
.grafica svg { width: 100%; height: auto; display: block; overflow: visible; }
.grafica text { fill: var(--tinta-3); font: 12px Figtree, system-ui, sans-serif; }
.leyenda { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 10px; font-size: 13.5px; color: var(--tinta-2); }
.globo { position: absolute; pointer-events: none; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px;
  padding: 8px 10px; font-size: 13px; box-shadow: 0 6px 20px rgb(0 0 0 / .12); min-width: 180px; display: none; z-index: 2; }
.globo b { display: block; margin-bottom: 4px; }
.globo div { display: flex; justify-content: space-between; gap: 12px; color: var(--tinta-2); }
.globo div span:last-child { color: var(--tinta); font-variant-numeric: tabular-nums; }
.columnas { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
.cabecera-ej { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.meta { color: var(--tinta-2); font-size: 13.5px; margin: 0 0 12px; }
.meta code { font-size: 12.5px; }
.parche { border-top: 1px solid var(--rejilla); padding: 10px 0; }
.parche-cab { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.parche-n { font-variant-numeric: tabular-nums; color: var(--tinta-3); font-size: 13px; min-width: 30px; }
.parche-t { font-weight: 600; flex: 1 1 200px; }
.delta { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--tinta-3); }
.delta.sube { color: var(--bien); } .delta.baja { color: var(--mal); }
.cambios { margin: 6px 0 0 38px; font-size: 13.5px; color: var(--tinta-2); }
.cambios ul { margin: 2px 0; padding-left: 18px; }
.archivos { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.archivo { font: 12px ui-monospace, Consolas, monospace; background: var(--chip); border-radius: 6px; padding: 1px 6px; }
.archivo.A { color: var(--bien); } .archivo.D { color: var(--mal); text-decoration: line-through; }
details summary { cursor: pointer; color: var(--tinta-3); font-size: 13px; }
pre { white-space: pre-wrap; font: 12.5px/1.5 ui-monospace, Consolas, monospace; background: var(--fondo); border-radius: 10px; padding: 10px; max-height: 420px; overflow: auto; }
.examen-fila { display: flex; justify-content: space-between; font-size: 13.5px; padding: 2px 0; }
.falla { color: var(--mal); font-size: 13px; margin-left: 12px; }
.vacio { color: var(--tinta-3); padding: 24px 0; text-align: center; }
.pista { color: var(--tinta-3); font-size: 13px; margin: 8px 0 0; }
.tabla-scroll { overflow-x: auto; }
.matriz td, .matriz th { text-align: center; padding: 6px 8px; }
.matriz td:first-child, .matriz th:first-child { text-align: left; }
.matriz .celda { font-weight: 700; font-variant-numeric: tabular-nums; cursor: pointer; border-radius: 8px; }
.matriz .celda.todo { background: color-mix(in srgb, var(--bien) 16%, transparent); color: var(--bien); }
.matriz .celda.parte { background: color-mix(in srgb, var(--aviso) 16%, transparent); color: var(--aviso); }
.matriz .celda.nada { background: color-mix(in srgb, var(--mal) 14%, transparent); color: var(--mal); }
.matriz .celda.curso { color: var(--acento); }
.matriz .celda.elegida { outline: 2px solid var(--tinta); }
.matriz .grupo-fila td { color: var(--tinta-3); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding-top: 14px; }
.matriz small { display: block; font-weight: 400; color: var(--tinta-3); font-size: 12px; }
@media (max-width: 640px) { .ocultar-movil { display: none; } .columnas { grid-template-columns: 1fr; } h1 { font-size: 23px; } }
</style>
</head>
<body>
<div class="pagina">
  <header>
    <div>
      <h1>Banco de pruebas</h1>
      <p class="sub">El mismo proyecto desde cero para cada contendiente (modelos, agente y flujo), corregido con un examen oculto
        después de cada parche. Se lanza con <code>Banco.bat</code>.</p>
    </div>
    <a class="boton" href="/">Volver a LocalHarness</a>
  </header>
  <nav class="grupos" id="grupos" aria-label="Prueba y modalidad"></nav>
  <div id="contenido"><p class="vacio">Cargando…</p></div>
</div>
<script type="module">
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const COLORES = 8;
let datos = null;
let grupo = null;
const elegidas = [];
const detalles = new Map();

const horas = (s) => (s >= 3600 ? `${(s / 3600).toFixed(1)} h` : `${Math.round(s / 60)} min`);
const miles = (n) => (n || 0).toLocaleString("es-ES");
const fecha = (iso) => (iso ? new Date(iso).toLocaleString("es-ES", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—");
const claseResultado = (r) => (/^integrado/.test(r || "") ? "integrado" : /descartado|falló|tiempo|no se pudo/.test(r || "") ? "mal" : "");

async function cargar() {
  datos = await (await fetch("/api/banco")).json();
  const grupos = gruposDe();
  if (!grupo || !grupos.some((g) => g.id === grupo)) grupo = (grupos.find((g) => g.ejecuciones.length) || grupos[0])?.id;
  pintar();
  if (datos.ejecuciones.some((e) => e.estado === "en marcha")) setTimeout(recargar, grupo?.startsWith("rep:") ? 8000 : 30000);
}

async function recargar() {
  for (const id of [...detalles.keys()]) if (datos.ejecuciones.find((e) => e.id === id)?.estado === "en marcha") detalles.delete(id);
  await cargar();
}

function gruposDe() {
  const out = [];
  for (const p of datos.pruebas) {
    for (const [m, c] of Object.entries(p.modalidades)) {
      const id = `${p.nombre}-${m}`;
      out.push({ id, prueba: p, modalidad: m, info: c, ejecuciones: datos.ejecuciones.filter((e) => e.id.split("/")[0] === id) });
    }
  }
  for (const r of datos.repertorios || []) {
    out.push({ id: `rep:${r.nombre}`, repertorio: r,
      ejecuciones: datos.ejecuciones.filter((e) => e.modalidad === "caso" && r.casos.includes(e.prueba)) });
  }
  return out;
}

function pintar() {
  const grupos = gruposDe();
  $("#grupos").innerHTML = grupos.map((g) => `<button class="grupo" data-grupo="${g.id}" aria-pressed="${g.id === grupo}">`
    + (g.repertorio ? `Casos · ${esc(g.repertorio.titulo)}` : `${esc(g.prueba.titulo)} · ${esc(g.modalidad)}`)
    + `<small>${g.ejecuciones.length}</small></button>`).join("");
  const g = grupos.find((x) => x.id === grupo);
  if (!g) { $("#contenido").innerHTML = '<p class="vacio">Todavía no hay pruebas en banco/pruebas.</p>'; return; }
  if (g.repertorio) { pintarCasos(g); return; }
  // el color sigue a la ejecución (por orden de inicio), nunca a su puesto en la clasificación
  const porInicio = [...g.ejecuciones].sort((a, b) => (a.inicio || "").localeCompare(b.inicio || ""));
  porInicio.forEach((e, i) => { e.color = i < COLORES ? `var(--s${i + 1})` : "var(--tinta-3)"; });
  const clasif = [...g.ejecuciones].sort((a, b) => (b.totales?.nota ?? -1) - (a.totales?.nota ?? -1));
  $("#contenido").innerHTML = ficha(g) + clasificacion(g, clasif) + (g.ejecuciones.length ? curva(g, porInicio) : "")
    + '<div id="detalle"></div>';
  pintarDetalle(g);
}

function ficha(g) {
  const ref = g.prueba.referencia ? `<a class="boton" href="/banco/abrir/ref/${g.prueba.nombre}/" target="_blank">Abrir la referencia</a>` : "";
  return `<section class="tarjeta ficha"><div><h2>${esc(g.prueba.titulo)} <span class="chip">${esc(g.prueba.tipo)}</span>`
    + ` <span class="chip">${esc(g.modalidad)} · ${g.info.parches} parches</span></h2><p>${esc(g.prueba.descripcion)}</p>`
    + `<p class="pista">${esc(g.info.descripcion)}</p></div>${ref}</section>`;
}

function clasificacion(g, filas) {
  if (!filas.length) {
    return `<section class="tarjeta"><h2>Clasificación</h2><p class="vacio">Nadie ha corrido esta prueba todavía.<br>`
      + `<code>Banco.bat</code> → ${esc(g.prueba.nombre)} → ${esc(g.modalidad)} → los contendientes que quieras.</p></section>`;
  }
  const cuerpo = filas.map((e) => {
    const t = e.totales || {};
    const mods = Object.values(t.modelos || {});
    const tok = mods.reduce((s, m) => s + m.tokens, 0);
    const seg = mods.reduce((s, m) => s + m.segundos, 0);
    const estado = e.estado === "en marcha" ? '<span class="chip vivo">en marcha</span>' : `<span class="chip">${esc(e.estado)}</span>`;
    return `<tr class="fila${elegidas.includes(e.id) ? " elegida" : ""}" data-id="${esc(e.id)}">`
      + `<td><span class="muestra" style="background:${e.color}"></span><span class="nombre">${esc(e.contendiente)}</span>`
      + `<div class="desc">${esc(e.modelos_cargados || e.descripcion)}</div></td>`
      + `<td class="num nota">${t.nota == null ? "—" : `${t.nota}<small> %</small>`}</td>`
      + `<td class="num">${t.integrados ?? 0} / ${e.parches_total}</td>`
      + `<td class="num ocultar-movil">${horas(t.segundos || 0)}</td>`
      + `<td class="num ocultar-movil">${miles(t.tokens)}</td>`
      + `<td class="num ocultar-movil">${seg ? (tok / seg).toFixed(1) : "—"}</td>`
      + `<td class="num ocultar-movil">${(t.coste || 0).toFixed(2)} $</td>`
      + `<td>${estado}<div class="desc">${fecha(e.inicio)}</div></td></tr>`;
  }).join("");
  return `<section class="tarjeta"><h2>Clasificación</h2><div class="tabla-scroll"><table><thead><tr><th>Contendiente</th>`
    + `<th class="num">Nota</th><th class="num">Integrados</th><th class="num ocultar-movil">Tiempo</th>`
    + `<th class="num ocultar-movil">Tokens</th><th class="num ocultar-movil">tok/s</th><th class="num ocultar-movil">Coste</th>`
    + `<th>Estado</th></tr></thead><tbody>${cuerpo}</tbody></table></div>`
    + `<p class="pista">Toca una fila para ver su changelog; toca dos para compararlas lado a lado.</p></section>`;
}

// --- curva de nota del examen oculto tras cada parche
const ANCHO = 900, ALTO = 300, M = { izq: 40, der: 120, arr: 12, aba: 30 };
function curva(g, series) {
  const total = Math.max(g.info.parches, ...series.map((e) => e.curva.length ? e.curva.at(-1)[0] : 0), 1);
  const x = (n) => M.izq + ((n - 1) / Math.max(total - 1, 1)) * (ANCHO - M.izq - M.der);
  const y = (v) => M.arr + (1 - v / 100) * (ALTO - M.arr - M.aba);
  let svg = "";
  for (const v of [0, 25, 50, 75, 100]) {
    svg += `<line x1="${M.izq}" x2="${ANCHO - M.der}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rejilla)" stroke-width="1"/>`
      + `<text x="${M.izq - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  const paso = Math.max(1, Math.ceil(total / 10));
  for (let n = 1; n <= total; n += paso) svg += `<text x="${x(n)}" y="${ALTO - 8}" text-anchor="middle">${n}</text>`;
  const etiquetas = series.length <= 4;
  for (const e of series) {
    const pts = e.curva.filter((p) => p[1] != null);
    if (!pts.length) continue;
    svg += `<polyline fill="none" stroke="${e.color}" stroke-width="2" stroke-linejoin="round" points="${pts.map((p) => `${x(p[0])},${y(p[1])}`).join(" ")}"/>`;
    for (const [n, v, r] of pts) {
      svg += /^integrado/.test(r || "")
        ? `<circle cx="${x(n)}" cy="${y(v)}" r="3.5" fill="${e.color}" stroke="var(--tarjeta)" stroke-width="2"/>`
        : `<circle cx="${x(n)}" cy="${y(v)}" r="4" fill="var(--tarjeta)" stroke="${e.color}" stroke-width="2"/>`;
    }
    if (etiquetas) {
      const [n, v] = pts.at(-1);
      svg += `<text x="${x(n) + 8}" y="${y(v) + 4}" style="fill:var(--tinta-2)">${esc(e.contendiente)} ${v}</text>`;
    }
  }
  svg += `<line id="cruz" y1="${M.arr}" y2="${ALTO - M.aba}" stroke="var(--tinta-3)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  svg += `<rect id="zona" x="${M.izq}" y="0" width="${ANCHO - M.izq - M.der}" height="${ALTO}" fill="transparent"/>`;
  const leyenda = series.map((e) => `<span><span class="muestra" style="background:${e.color}"></span>${esc(e.contendiente)}</span>`).join("")
    + '<span>● integrado · ○ descartado o fallido</span>';
  curvaActual = { series, total, x };
  return `<section class="tarjeta"><h2>Nota del examen oculto tras cada parche (%)</h2><div class="leyenda">${leyenda}</div>`
    + `<div class="grafica"><svg viewBox="0 0 ${ANCHO} ${ALTO}" role="img" aria-label="Nota del examen por parche y contendiente">${svg}</svg>`
    + `<div class="globo" id="globo"></div></div></section>`;
}
let curvaActual = null;

function moverCruz(ev) {
  const svg = ev.currentTarget.ownerSVGElement;
  const caja = svg.getBoundingClientRect();
  const px = ((ev.clientX - caja.left) / caja.width) * ANCHO;
  const { series, total, x } = curvaActual;
  let n = 1;
  for (let i = 1; i <= total; i++) if (Math.abs(x(i) - px) < Math.abs(x(n) - px)) n = i;
  const cruz = svg.querySelector("#cruz");
  cruz.setAttribute("x1", x(n)); cruz.setAttribute("x2", x(n)); cruz.setAttribute("visibility", "visible");
  const filas = series.map((e) => {
    const p = e.curva.find((c) => c[0] === n);
    return p ? `<div><span><span class="muestra" style="background:${e.color}"></span>${esc(e.contendiente)}</span>`
      + `<span>${p[1] ?? "—"} % · ${esc(p[2])}</span></div>` : "";
  }).join("");
  const globo = $("#globo");
  globo.innerHTML = `<b>Parche ${n}</b>${filas || '<div><span>sin datos</span></div>'}`;
  globo.style.display = "block";
  const izq = (x(n) / ANCHO) * caja.width;
  globo.style.left = `${Math.min(izq + 12, caja.width - globo.offsetWidth)}px`;
  globo.style.top = "8px";
}

// --- repertorio de casos cortos: clasificación, nota media por caso y matriz casos × contendientes
const GRUPOS = { escribir: "Escribir", tests: "Tests", diagnosticar: "Diagnosticar", arreglar: "Arreglar",
  ampliar: "Ampliar sin romper", varios: "Varios archivos", tangible: "Web y juegos" };
let casosActual = null;

function pintarCasos(g) {
  const r = g.repertorio;
  const fichas = Object.fromEntries((datos.casos || []).map((c) => [c.nombre, c]));
  // el color sigue al contendiente (por su primera ejecución), nunca a su puesto
  const conts = [];
  for (const e of [...g.ejecuciones].sort((a, b) => (a.inicio || "").localeCompare(b.inicio || ""))) {
    if (!conts.includes(e.contendiente)) conts.push(e.contendiente);
  }
  const color = (c) => { const i = conts.indexOf(c); return i < COLORES ? `var(--s${i + 1})` : "var(--tinta-3)"; };
  g.ejecuciones.forEach((e) => { e.color = color(e.contendiente); });
  const celdas = {};
  for (const e of g.ejecuciones) {
    const k = `${e.prueba}|${e.contendiente}`;
    const c = celdas[k] ??= { notas: [], ids: [], curso: false };
    c.ids.push(e.id);
    if (e.estado === "en marcha") c.curso = true;
    else if (e.estado === "terminada" && e.totales?.nota != null) c.notas.push(e.totales.nota);
  }
  const media = (xs) => (xs.length ? Math.round((xs.reduce((a, b) => a + b, 0) / xs.length) * 10) / 10 : null);

  // clasificación
  const filas = conts.map((c) => {
    const mias = g.ejecuciones.filter((e) => e.contendiente === c);
    const term = mias.filter((e) => e.estado === "terminada" && e.totales?.nota != null);
    const casos = r.casos.filter((k) => celdas[`${k}|${c}`]?.notas.length);
    const medias = casos.map((k) => media(celdas[`${k}|${c}`].notas));
    return { c, aprobados: term.filter((e) => e.totales.nota >= 100).length, tiradas: term.length,
      media: media(medias), casos: casos.length, segundos: term.reduce((a, e) => a + (e.totales.segundos || 0), 0),
      vivo: mias.some((e) => e.estado === "en marcha"), ultima: mias.map((e) => e.inicio || "").sort().at(-1),
      desc: mias.at(-1)?.modelos_cargados || mias.at(-1)?.descripcion || "" };
  }).sort((a, b) => (b.media ?? -1) - (a.media ?? -1));
  const clasif = filas.length ? `<section class="tarjeta"><h2>Clasificación</h2><div class="tabla-scroll"><table><thead><tr>`
    + `<th>Contendiente</th><th class="num">Nota media</th><th class="num">Aprobados</th><th class="num">Casos</th>`
    + `<th class="num ocultar-movil">Tiempo</th><th>Estado</th></tr></thead><tbody>`
    + filas.map((f) => `<tr><td><span class="muestra" style="background:${color(f.c)}"></span><span class="nombre">${esc(f.c)}</span>`
      + `<div class="desc">${esc(f.desc)}</div></td><td class="num nota">${f.media == null ? "—" : `${f.media}<small> %</small>`}</td>`
      + `<td class="num">${f.aprobados} / ${f.tiradas}</td><td class="num">${f.casos} / ${r.casos.length}</td>`
      + `<td class="num ocultar-movil">${horas(f.segundos)}</td><td>${f.vivo ? '<span class="chip vivo">en marcha</span>' : '<span class="chip">parado</span>'}`
      + `<div class="desc">${fecha(f.ultima)}</div></td></tr>`).join("")
    + `</tbody></table></div><p class="pista">Nota media = media de la nota de cada caso (de sus tiradas terminadas). Aprobado = nota 100.</p></section>`
    : `<section class="tarjeta"><h2>Clasificación</h2><p class="vacio">Nadie ha corrido este repertorio todavía.<br>`
      + `Pestaña <b>Banco</b> de LocalHarness → prueba «${esc(r.titulo)}» → Añadir a la cola → Empezar.</p></section>`;

  // gráfica: nota media de cada caso, un punto por contendiente
  const orden = [...r.casos].sort((a, b) => Object.keys(GRUPOS).indexOf(fichas[a]?.grupo) - Object.keys(GRUPOS).indexOf(fichas[b]?.grupo));
  const AN = 900, AL = 320, MM = { izq: 40, der: 12, arr: 26, aba: 92 };
  const banda = (AN - MM.izq - MM.der) / orden.length;
  const bx = (i) => MM.izq + banda * i;
  const y = (v) => MM.arr + (1 - v / 100) * (AL - MM.arr - MM.aba);
  let svg = "";
  for (const v of [0, 25, 50, 75, 100]) {
    svg += `<line x1="${MM.izq}" x2="${AN - MM.der}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rejilla)"/>`
      + `<text x="${MM.izq - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  let grupoPrevio = null;
  orden.forEach((k, i) => {
    const gr = fichas[k]?.grupo;
    if (gr !== grupoPrevio) {
      if (i) svg += `<line x1="${bx(i)}" x2="${bx(i)}" y1="${MM.arr - 18}" y2="${AL - MM.aba}" stroke="var(--borde)"/>`;
      svg += `<text x="${bx(i) + 4}" y="${MM.arr - 8}" style="fill:var(--tinta-2)">${esc(GRUPOS[gr] || gr || "")}</text>`;
      grupoPrevio = gr;
    }
    const cx = bx(i) + banda / 2;
    svg += `<text transform="translate(${cx + 4},${AL - MM.aba + 10}) rotate(-50)" text-anchor="end">${esc(k)}</text>`;
    conts.forEach((c, j) => {
      const m = media(celdas[`${k}|${c}`]?.notas || []);
      if (m == null) return;
      const dx = conts.length > 1 ? (j - (conts.length - 1) / 2) * Math.min(7, banda / (conts.length + 1)) : 0;
      svg += `<circle cx="${cx + dx}" cy="${y(m)}" r="5" fill="${color(c)}" stroke="var(--tarjeta)" stroke-width="2"/>`;
    });
    svg += `<rect data-banda="${esc(k)}" x="${bx(i)}" y="${MM.arr}" width="${banda}" height="${AL - MM.arr - MM.aba}" fill="transparent"/>`;
  });
  casosActual = { conts, color, celdas, media, fichas, AN, banda, bx, orden };
  const leyenda = conts.map((c) => `<span><span class="muestra" style="background:${color(c)}"></span>${esc(c)}</span>`).join("");
  const grafica = conts.length ? `<section class="tarjeta"><h2>Nota media por caso (%)</h2><div class="leyenda">${leyenda}</div>`
    + `<div class="grafica"><svg viewBox="0 0 ${AN} ${AL}" role="img" aria-label="Nota media de cada caso por contendiente">${svg}</svg>`
    + `<div class="globo" id="globo"></div></div><p class="pista">Pasa el ratón por un caso para ver el detalle; la tabla de abajo tiene los mismos datos.</p></section>` : "";

  // matriz
  let cuerpo = "";
  grupoPrevio = null;
  for (const k of orden) {
    const gr = fichas[k]?.grupo;
    if (gr !== grupoPrevio) { cuerpo += `<tr class="grupo-fila"><td colspan="${conts.length + 1}">${esc(GRUPOS[gr] || gr || "")}</td></tr>`; grupoPrevio = gr; }
    cuerpo += `<tr><td><span class="nombre">${esc(fichas[k]?.titulo || k)}</span><small>${esc(k)}</small></td>`
      + conts.map((c) => {
        const x = celdas[`${k}|${c}`];
        if (!x) return "<td>—</td>";
        const ap = x.notas.filter((n) => n >= 100).length;
        const clase = x.curso && !x.notas.length ? "curso" : !x.notas.length ? "" : ap === x.notas.length ? "todo" : ap ? "parte" : "nada";
        const texto = x.curso && !x.notas.length ? "en curso" : `${ap}/${x.notas.length}${x.curso ? " ·…" : ""}`;
        return `<td class="celda ${clase}" data-celda="${esc(x.ids.join(","))}" title="nota media ${media(x.notas) ?? "—"} · toca para ver el detalle">${texto}`
          + `<small>${media(x.notas) ?? ""}${x.notas.length ? " %" : ""}</small></td>`;
      }).join("") + "</tr>";
  }
  const matriz = conts.length ? `<section class="tarjeta"><h2>Casos × contendientes</h2><div class="tabla-scroll"><table class="matriz"><thead><tr><th>Caso</th>`
    + conts.map((c) => `<th><span class="muestra" style="background:${color(c)}"></span>${esc(c)}</th>`).join("")
    + `</tr></thead><tbody>${cuerpo}</tbody></table></div><p class="pista">Aprobados / tiradas terminadas, y la nota media. Toca una celda para ver sus ejecuciones abajo (las dos últimas).</p></section>` : "";

  const ficha = `<section class="tarjeta ficha"><div><h2>Casos · ${esc(r.titulo)} <span class="chip">${r.casos.length} casos</span>`
    + ` <span class="chip">${r.minutos_tarea} min por caso</span></h2><p>${esc(r.descripcion || "")}</p>`
    + `<p class="pista">Cada caso es un parche corto contra un fallo concreto, con su examen oculto. Se lanzan desde la pestaña Banco de LocalHarness.</p></div></section>`;
  $("#contenido").innerHTML = ficha + clasif + grafica + matriz + '<div id="detalle"></div>';
  pintarDetalle(g);
}

function globoCaso(ev) {
  const k = ev.target.dataset.banda;
  const { conts, color, celdas, media, fichas, AN, banda, bx, orden } = casosActual;
  const svg = ev.target.ownerSVGElement;
  const caja = svg.getBoundingClientRect();
  const filas = conts.map((c) => {
    const x = celdas[`${k}|${c}`];
    if (!x) return "";
    const ap = x.notas.filter((n) => n >= 100).length;
    return `<div><span><span class="muestra" style="background:${color(c)}"></span>${esc(c)}</span>`
      + `<span>${media(x.notas) ?? "—"} % · ${ap}/${x.notas.length}${x.curso ? " · en curso" : ""}</span></div>`;
  }).join("");
  const globo = $("#globo");
  globo.innerHTML = `<b>${esc(fichas[k]?.titulo || k)}</b>${filas || "<div><span>sin tiradas</span></div>"}`;
  globo.style.display = "block";
  const izq = ((bx(orden.indexOf(k)) + banda) / AN) * caja.width;
  globo.style.left = `${Math.min(izq + 8, caja.width - globo.offsetWidth)}px`;
  globo.style.top = "8px";
}

// --- detalle de una o dos ejecuciones
async function pintarDetalle(g) {
  const ids = elegidas.filter((id) => g.ejecuciones.some((e) => e.id === id));
  const caja = $("#detalle");
  if (!caja) return;
  if (!ids.length) { caja.innerHTML = ""; return; }
  for (const id of ids) if (!detalles.has(id)) detalles.set(id, await (await fetch(`/api/banco/ejecucion/${id}`)).json());
  caja.innerHTML = `<div class="columnas">${ids.map((id) => columna(detalles.get(id), g.ejecuciones.find((e) => e.id === id))).join("")}</div>`;
}

function columna(d, e) {
  const ex = d.examen_final;
  const examen = ex ? (ex.filas || []).map((f) => `<div class="examen-fila"><span>${esc(f.archivo)}</span><span>${f.pasan} / ${f.tests}</span></div>`
    + f.fallan.map((n) => `<div class="falla">✖ ${esc(n)}</div>`).join("")).join("") : '<p class="pista">El examen final se pasa al terminar.</p>';
  let anterior = 0;
  const parches = d.parches.map((p) => {
    const nota = p.examen?.nota;
    const delta = nota == null ? "" : nota - anterior;
    if (nota != null) anterior = nota;
    const dtxt = delta === "" ? "" : `<span class="delta ${delta > 0 ? "sube" : delta < 0 ? "baja" : ""}">${nota} %${delta ? ` (${delta > 0 ? "+" : ""}${Math.round(delta * 10) / 10})` : ""}</span>`;
    const archivos = (p.archivos || []).map((a) => `<span class="archivo ${esc(a.estado)}">${esc(a.ruta)}</span>`).join("");
    const cl = (p.changelog || []).map((l) => `<li>${esc(l.replace(/^- /, ""))}</li>`).join("");
    return `<div class="parche"><div class="parche-cab"><span class="parche-n">${String(p.n).padStart(3, "0")}</span>`
      + `<span class="parche-t">${esc(p.titulo)}</span><span class="chip ${claseResultado(p.resultado)}">${esc(p.resultado)}${p.reintento ? " · reintento" : ""}</span>`
      + `${dtxt}</div><div class="cambios">${Math.round(p.segundos / 60)} min · ${miles(p.tokens)} tokens${p.coste ? ` · ${p.coste.toFixed(3)} $` : ""}`
      + `${cl ? `<ul>${cl}</ul>` : ""}${archivos ? `<div class="archivos">${archivos}</div>` : ""}`
      + `${p.final ? `<details><summary>Informe del agente</summary><pre>${esc(p.final)}</pre></details>` : ""}</div></div>`;
  }).join("");
  const id = d.id.split("/");
  return `<section class="tarjeta"><div class="cabecera-ej"><h2><span class="muestra" style="background:${e.color}"></span>${esc(d.contendiente?.nombre)}</h2>`
    + `<a class="boton principal" href="/banco/abrir/${id[0]}/${id[1]}/" target="_blank">Abrir el proyecto</a></div>`
    + `<p class="meta">${esc(d.agente)} · ${esc(d.modelos_cargados || "")}<br>${fecha(d.inicio)} → ${fecha(d.fin)} · <code>${esc(d.repo)}</code></p>`
    + `<details open><summary>Examen final: ${ex ? `${ex.pasan} de ${ex.total} = ${ex.nota} %` : "pendiente"}</summary>${examen}</details>`
    + `<h2 style="margin-top:14px">Changelog e incorporaciones</h2>${parches || '<p class="vacio">Aún no ha terminado ningún parche.</p>'}`
    + `<details><summary>CHANGELOG.md del proyecto</summary><pre>${esc(d.changelog_md)}</pre></details>`
    + `<details><summary>Informe del autopiloto</summary><pre>${esc(d.informe_md)}</pre></details></section>`;
}

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-grupo]");
  if (b) { grupo = b.dataset.grupo; elegidas.length = 0; pintar(); return; }
  const celda = ev.target.closest("[data-celda]");
  if (celda) {
    const ids = celda.dataset.celda.split(",").filter(Boolean);
    elegidas.length = 0;
    elegidas.push(...ids.slice(-2));
    document.querySelectorAll("[data-celda]").forEach((c) => c.classList.toggle("elegida", c === celda));
    pintarDetalle(gruposDe().find((x) => x.id === grupo));
    $("#detalle")?.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const fila = ev.target.closest("tr.fila");
  if (fila) {
    const id = fila.dataset.id;
    const i = elegidas.indexOf(id);
    if (i >= 0) elegidas.splice(i, 1);
    else { elegidas.push(id); if (elegidas.length > 2) elegidas.shift(); }
    document.querySelectorAll("tr.fila").forEach((f) => f.classList.toggle("elegida", elegidas.includes(f.dataset.id)));
    pintarDetalle(gruposDe().find((g) => g.id === grupo));
  }
});
document.addEventListener("pointermove", (ev) => {
  if (ev.target.id === "zona") moverCruz({ ...ev, clientX: ev.clientX, currentTarget: ev.target });
  else if (ev.target.dataset?.banda) globoCaso(ev);
});
document.addEventListener("pointerout", (ev) => {
  if (ev.target.dataset?.banda) { $("#globo") && ($("#globo").style.display = "none"); return; }
  if (ev.target.id !== "zona") return;
  $("#globo") && ($("#globo").style.display = "none");
  document.querySelector("#cruz")?.setAttribute("visibility", "hidden");
});
cargar().catch((e) => { $("#contenido").innerHTML = `<p class="vacio">No pude leer /api/banco: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
