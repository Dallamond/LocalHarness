# Pruebas en cada push y pull request: Python en Linux y Windows (el PC de uso es Windows) y la web.
# Las pruebas usan CLIs falsas (tests/fakes): nunca llaman a Claude de verdad ni gastan plan.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[server]" ruff
      - name: Lint
        run: python -m ruff check localharness tests
      - name: Pruebas
        run: python -m unittest discover -s tests -t .

  web:
    name: Web (tipos y compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npm run build
