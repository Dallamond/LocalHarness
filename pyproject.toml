[project]
name = "localharness"
version = "0.0.1"
description = "Banco de agentes local: proyectos, tareas, adaptadores CLI (Claude/Codex/llama.cpp) y revisión por git"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
localharness = "localharness.cli:main"

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "psutil>=5.9"]
dev = []


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["localharness*"]

[tool.setuptools.package-data]
localharness = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["web", "data", "_referencias"]

[tool.ruff.lint]
# errores reales (F), sintaxis (E9), imports y bugs típicos (B); el estilo compacto de las pruebas se respeta
select = ["E4", "E7", "E9", "F", "B", "UP"]
ignore = ["E701", "E702", "E731", "E741", "B008", "UP015"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E401", "B011"]
