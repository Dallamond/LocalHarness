[project]
name = "localharness"
version = "0.0.1"
description = "Banco de agentes local: proyectos, tareas, adaptadores CLI (Claude/Codex/llama.cpp) y revisión por git"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
localharness = "localharness.cli:main"

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
dev = []


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["localharness*"]
