<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalHarness · Oficina de agentes (prototipo v2)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root{
  --bg:#e9eff7; --panel:#ffffff; --panel2:#f6f8fb; --line:#e2e8f0; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
  --accent:#5b5bf0; --ok:#16a34a; --warn:#f59e0b; --bad:#e11d48; --colw:330px;
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Plus Jakarta Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9px}::-webkit-scrollbar-track{background:transparent}

#app{height:100vh;display:grid;grid-template-columns:var(--colw) minmax(0,1fr) var(--colw);grid-template-rows:56px minmax(0,1fr);gap:12px;padding:12px;
  background:radial-gradient(1200px 600px at 20% -10%,#dbe7ff 0%,transparent 60%),radial-gradient(900px 500px at 100% 110%,#ffe9d2 0%,transparent 55%),var(--bg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.12)}
.ui-hidden #left,.ui-hidden #right,.ui-hidden #top{display:none}
.ui-hidden #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.ui-hidden #stage{grid-column:1}

/* top bar */
#top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 12px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#5b5bf0,#22c1c3);display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px -4px rgba(91,91,240,.55)}
.brand b{font-weight:800;font-size:15px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:var(--ink3);font-weight:600;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.sep{width:1px;height:26px;background:var(--line)}
.spacer{flex:1}
select#mission{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-weight:600;max-width:260px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;color:var(--ink2);transition:.15s}
.btn:hover{background:#eef2f7;color:var(--ink)}.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 16px -8px rgba(91,91,240,.7)}.btn.primary:hover{background:#4a4ae0}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ok:hover{background:#12873d}
.btn.bad{background:#fff;border-color:#fecdd3;color:var(--bad)}.btn.bad:hover{background:#fff1f2}
.btn.sm{padding:5px 9px;border-radius:10px;font-size:12px}
kbd{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:5px;background:rgba(15,23,42,.1);margin-left:2px}
.btn.ok kbd{background:rgba(255,255,255,.25)}
.switch{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none;white-space:nowrap}
.switch input{appearance:none;width:30px;height:18px;border-radius:99px;background:#cbd5e1;position:relative;transition:.2s;cursor:pointer}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked{background:var(--ok)}.switch input:checked::after{left:14px}
.rank{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:12px;background:linear-gradient(135deg,#fff7e6,#fff);border:1px solid #fde7b5}
.rank .lv{font-weight:800;color:#b45309}.rank .xpbar{width:90px}
.xpbar{height:6px;border-radius:9px;background:#e8edf4;overflow:hidden}.xpbar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#fbbf24,#f97316);border-radius:9px;transition:width .4s}
.icon-btn{width:34px;height:34px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.icon-btn:hover{background:#eef2f7}
#ach-pop{position:absolute;top:64px;right:20px;z-index:60;width:300px;padding:12px;display:none}
#ach-pop.on{display:block}
.ach{display:flex;gap:10px;padding:8px;border-radius:12px;align-items:center;opacity:.45}
.ach.got{opacity:1;background:#fffbeb}
.ach i{width:30px;height:30px;border-radius:10px;background:#e2e8f0;display:grid;place-items:center;color:#64748b}
.ach.got i{background:#fde68a;color:#b45309}
.ach b{display:block;font-size:12.5px}.ach span{font-size:11px;color:var(--ink2)}

/* side columns */
.col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.col .card{padding:14px}
.card h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:800;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card h3 em{font-style:normal;letter-spacing:0;text-transform:none;font-weight:700;color:var(--ink2)}
.grow{flex:1;min-height:0;overflow:auto}

/* mission steps */
.m-title{font-weight:800;font-size:15px;letter-spacing:-.01em}
.m-brief{color:var(--ink2);margin:2px 0 10px}
.m-prog{height:8px;background:#e8edf4;border-radius:9px;overflow:hidden;margin-bottom:12px}
.m-prog span{display:block;height:100%;width:0;background:linear-gradient(90deg,#5b5bf0,#22c1c3);transition:width .4s;border-radius:9px}
.steps{display:flex;flex-direction:column;gap:2px;position:relative}
.step{display:grid;grid-template-columns:26px 1fr auto;gap:9px;align-items:center;padding:6px 6px;border-radius:12px;position:relative;opacity:.55;transition:.2s}
.step .dot{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:11px;color:#fff;background:var(--c);filter:saturate(.5) brightness(1.1)}
.step b{font-weight:700;font-size:12.5px;display:block}
.step small{color:var(--ink3);font-size:11px}
.step .st{font-size:11px;color:var(--ink3)}
.step .bar{position:absolute;left:41px;right:8px;bottom:2px;height:2px;border-radius:2px;background:transparent;overflow:hidden}
.step .bar span{display:block;height:100%;width:0;background:var(--c)}
.step.done{opacity:1}.step.done .dot{filter:none;opacity:.85}.step.done .st{color:var(--ok)}
.step.active{opacity:1;background:color-mix(in srgb,var(--c) 9%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent)}
.step.active .dot{filter:none;animation:pulse 1.6s infinite}.step.active .bar{background:#e8edf4}
.step.ask-s .dot{background:#f59e0b}
@keyframes pulse{50%{transform:scale(1.12)}}

/* approvals */
.ask{border:1.5px solid #fcd34d;background:linear-gradient(180deg,#fffbeb,#fff);border-radius:16px;padding:12px;margin-bottom:10px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.ask-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.from{font-size:11px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:6px}
.from i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.risk{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px}
.risk-bajo{background:#dcfce7;color:#15803d}.risk-medio{background:#fef3c7;color:#b45309}.risk-alto{background:#ffe4e6;color:#be123c}
.ask h4{font-size:13.5px;margin-bottom:6px;font-weight:800}.ask h4 small{font-weight:700;color:var(--accent);margin-left:4px}
.ask ul{list-style:none;display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.ask li{color:var(--ink2);font-size:12px;padding-left:16px;position:relative;line-height:1.35}
.ask li::before{content:"\f054";font-family:"Font Awesome 6 Free";font-weight:900;font-size:8px;position:absolute;left:3px;top:4px;color:var(--ink3)}
.cmd{display:flex;align-items:center;gap:6px;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:6px 8px;margin-bottom:8px;font-family:var(--mono);font-size:11px}
.cmd code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cmd button{color:#94a3b8}.cmd button:hover{color:#fff}
.cmd-note{font-size:10.5px;color:var(--ink3);margin:-4px 0 8px}
.ask input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;margin-bottom:8px}
.ask-actions{display:flex;gap:8px}.ask-actions .btn{flex:1}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--ink3);font-size:12px;line-height:1.5}
.empty i{font-size:20px;display:block;margin-bottom:6px;color:#cbd5e1}
.hist{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:11.5px;color:var(--ink2);border-top:1px solid var(--line)}
.hist i.ok{color:var(--ok)}.hist i.no{color:var(--bad)}

/* resources */
.res-row{margin-bottom:10px}
.res-row .l{display:flex;justify-content:space-between;font-weight:700;font-size:12px;margin-bottom:4px}
.res-row .l span{color:var(--ink3);font-weight:600;font-family:var(--mono);font-size:11px}
.meter{height:9px;border-radius:9px;background:#e8edf4;overflow:hidden;position:relative}
.meter span{display:block;height:100%;border-radius:9px;transition:width .4s,background .4s}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);font-family:var(--mono)}
.chip.active{background:#eef2ff;border-color:#c7d2fe;color:#4338ca}.chip.ready{background:#ecfdf5;border-color:#a7f3d0;color:#047857}.chip.merged{background:#f1f5f9;color:#94a3b8;text-decoration:line-through}
#spark{width:100%;height:38px;display:block;margin-top:4px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kv div{background:var(--panel2);border-radius:12px;padding:8px 10px}.kv b{display:block;font-size:15px;font-weight:800}.kv span{font-size:10.5px;color:var(--ink3);font-weight:600}

/* inspector */
.insp-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:19px;color:#fff;background:var(--c);box-shadow:0 8px 16px -8px var(--c)}
.insp-h b{font-size:15px;font-weight:800;display:block}.insp-h small{color:var(--ink2);font-weight:600}
.prov{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:99px;text-transform:uppercase}
.prov.claude{background:#fff1e6;color:#c2410c}.prov.local{background:#e0f2fe;color:#0369a1}.prov.human{background:#fef3c7;color:#b45309}
.lvrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lvbadge{font-weight:800;font-size:12px;color:#fff;background:linear-gradient(135deg,#f59e0b,#f97316);padding:3px 8px;border-radius:9px}
.lvrow .xpbar{flex:1}.lvrow small{font-family:var(--mono);color:var(--ink3);font-size:10.5px}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 12px}
.skill{font-family:var(--mono);font-size:10.5px;font-weight:600;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 7px;display:flex;gap:6px;align-items:center}
.skill i{color:var(--ok);font-size:9px}
.nudge{display:flex;gap:6px}.nudge input{flex:1;border:1px solid var(--line);border-radius:11px;padding:7px 10px;background:var(--panel2);min-width:0}
.nudge input:focus,.ask input:focus,select:focus{outline:2px solid #c7d2fe}

/* stage */
#stage{display:flex;flex-direction:column;min-height:0;min-width:0;border-radius:22px;overflow:hidden;position:relative;border:1px solid var(--line);box-shadow:0 12px 30px -16px rgba(15,23,42,.25);background:linear-gradient(180deg,#cfe2ff 0%,#e9f1fb 52%,#f6efe4 100%)}
#viewport{flex:1;position:relative;min-height:0;overflow:hidden}
#viewport canvas{display:block;width:100%;height:100%;cursor:grab}#viewport canvas:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:5px;will-change:transform}
.bubble{max-width:230px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:5px 9px;font-size:11px;font-weight:600;color:var(--ink2);box-shadow:0 8px 18px -8px rgba(15,23,42,.3);text-align:center;line-height:1.3;transition:opacity .25s,transform .25s}
.bubble.off{opacity:0;transform:translateY(6px)}
.plate{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.96);border:1.5px solid color-mix(in srgb,var(--c) 40%,#fff);border-radius:13px;padding:4px 9px 4px 5px;box-shadow:0 8px 18px -10px rgba(15,23,42,.45);transition:transform .15s}
.plate:hover{transform:scale(1.05)}.plate.sel{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent),0 8px 18px -10px rgba(15,23,42,.45)}
.plate .lv{background:var(--c);color:#fff;font-weight:800;font-size:10px;border-radius:8px;padding:3px 6px}
.plate .nm{font-weight:800;font-size:12px;line-height:1.1}.plate .nm small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.plate .nm small.working{color:var(--c)}.plate .nm small.waiting{color:#d97706}
.plate .mini{width:34px}
.tag{pointer-events:none;background:rgba(15,23,42,.78);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px}
.floatxp{position:absolute;font-weight:800;color:#d97706;text-shadow:0 1px 0 #fff,0 0 8px #fff;font-size:15px;animation:floatup 1.5s ease-out forwards;pointer-events:none;white-space:nowrap}
@keyframes floatup{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
#views{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:0 8px 18px -10px rgba(15,23,42,.35);max-width:96%;overflow-x:auto}
#views button{padding:5px 10px;border-radius:10px;font-weight:700;font-size:11.5px;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:6px}
#views button i.d{width:8px;height:8px;border-radius:50%;background:var(--c,#94a3b8)}
#views button:hover{background:#eef2f7}#views button.on{background:var(--ink);color:#fff}
#toasts{position:absolute;top:58px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:20}
.toast{display:flex;align-items:center;gap:10px;background:#0f172a;color:#fff;border-radius:14px;padding:8px 14px 8px 8px;box-shadow:0 14px 30px -10px rgba(15,23,42,.6);animation:toast 4s ease forwards}
.toast i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#fbbf24,#f97316);display:grid;place-items:center;color:#fff}
.toast b{display:block;font-size:12.5px}.toast span{font-size:11px;color:#94a3b8}
@keyframes toast{0%{transform:translateY(-14px) scale(.9);opacity:0}8%,86%{transform:none;opacity:1}100%{transform:translateY(-8px);opacity:0}}
#modal{position:absolute;inset:0;display:none;place-items:center;background:rgba(15,23,42,.28);backdrop-filter:blur(3px);z-index:30}
#modal.on{display:grid}
.result{width:360px;background:#fff;border-radius:24px;padding:22px;text-align:center;box-shadow:0 30px 60px -20px rgba(15,23,42,.5);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.result h2{font-size:20px;font-weight:800;letter-spacing:-.01em}.result p{color:var(--ink2);margin:2px 0 12px}
.stars{font-size:30px;color:#e2e8f0;letter-spacing:6px;margin-bottom:12px}.stars .on{color:#fbbf24;filter:drop-shadow(0 4px 6px rgba(251,191,36,.5))}
.result .kv{margin-bottom:14px}.result .row{display:flex;gap:8px}.result .row .btn{flex:1}

/* dock */
#dock{height:230px;background:rgba(255,255,255,.94);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:height .25s}
#dock.min{height:40px}
.dock-h{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line)}
.tab{padding:5px 11px;border-radius:10px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tab:hover{background:#eef2f7}.tab.on{background:var(--ink);color:#fff}
.tab .n{font-size:10px;background:rgba(148,163,184,.3);padding:0 6px;border-radius:99px}
.dock-body{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;overflow:auto;padding:8px 12px;display:none}.pane.on{display:block}
.ev{display:grid;grid-template-columns:44px 8px 1fr;gap:8px;align-items:baseline;padding:3px 0;font-size:12px}
.ev time{font-family:var(--mono);color:var(--ink3);font-size:10.5px}.ev i{width:8px;height:8px;border-radius:50%;background:var(--c);align-self:center}
.ev b{font-weight:800}.ev.ok span{color:var(--ok)}.ev.bad span{color:var(--bad);font-weight:700}.ev.ask span{color:#b45309;font-weight:700}
#pane-term,#pane-diff{background:#0b1220;color:#cbd5e1;font-family:var(--mono);font-size:11.5px;line-height:1.55}
#pane-term .p{color:#34d399}#pane-term .e{color:#f87171}#pane-term .g{color:#4ade80}#pane-term .h{color:#64748b}
.dl{white-space:pre;display:block;padding:0 6px;border-radius:3px}.dl.add{background:rgba(74,222,128,.14);color:#86efac}.dl.del{background:rgba(248,113,113,.14);color:#fca5a5}.dl.ctx{color:#94a3b8}
.dfile{color:#93c5fd;font-weight:600;margin-bottom:6px}

@media (max-width:1180px){:root{--colw:270px}.rank .xpbar{display:none}.switch span{display:none}}
@media (max-width:980px){#app{grid-template-columns:minmax(0,1fr)}#left,#right{display:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">

  <header id="top" class="card">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-cubes"></i></div>
      <div><b>LocalHarness</b><small>Oficina de agentes · v2</small></div>
    </div>
    <div class="sep"></div>
    <select id="mission" title="Misión"></select>
    <button id="run" class="btn primary"><i class="fa-solid fa-play"></i> Ejecutar</button>
    <button id="pause" class="btn" title="Pausa (Espacio)"><i class="fa-solid fa-pause"></i></button>
    <button id="speed" class="btn" title="Velocidad">1x</button>
    <div class="spacer"></div>
    <label class="switch" title="Aprueba solo sin preguntarte (para demos)"><input type="checkbox" id="auto"><span>Auto-aprobar</span></label>
    <label class="switch" title="La cámara sigue a quien trabaja (ideal para grabar vídeo)"><input type="checkbox" id="cine"><span>Cámara cine</span></label>
    <div class="sep"></div>
    <div class="rank" title="XP del equipo"><i class="fa-solid fa-star" style="color:#f59e0b"></i><span class="lv" id="rank-lv">Rango 1</span><div class="xpbar"><span id="rank-bar"></span></div><span id="rank-xp" style="font-family:var(--mono);font-size:11px;color:var(--ink2)">0 XP</span></div>
    <button id="btn-ach" class="icon-btn" title="Logros"><i class="fa-solid fa-trophy"></i></button>
    <button id="btn-audio" class="icon-btn" title="Sonido"><i id="audio-i" class="fa-solid fa-volume-high"></i></button>
    <button id="btn-ui" class="icon-btn" title="Ocultar interfaz (H)"><i class="fa-solid fa-expand"></i></button>
  </header>
  <div id="ach-pop" class="card"></div>

/* ---------- picking ---------- */
function setupPicking(){
  const ray=new THREE.Raycaster(),v=new THREE.Vector2();let down=null;
  const cv=renderer.domElement;
  const pick=e=>{const r=cv.getBoundingClientRect();v.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(v,camera);
    const h=ray.intersectObjects(clickable,false);return h.length?h[0].object.userData.agent:null};
  cv.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});
  cv.addEventListener('pointerup',e=>{if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<5){const id=pick(e);if(id)selectAgent(id,true)}down=null});
  let last=0;cv.addEventListener('pointermove',e=>{const n=performance.now();if(n-last<60)return;last=n;if(e.buttons)return;cv.style.cursor=pick(e)?'pointer':''});
}

  const s=A3[a].group.position.clone().add(new THREE.Vector3(0,1.9,-.4)),e=A3[b].group.position.clone().add(new THREE.Vector3(0,1.9,-.4));

function updPackets(dt){
  for(let i=packets.length-1;i>=0;i--){const p=packets[i];p.p+=dt*(.5+.25*S.speed);
    if(p.p>=1){scene.remove(p.m);burst(p.e,AG[p.a].color,10,1.6);packets.splice(i,1);continue}
    const t=p.p,mid=p.s.clone().add(p.e).multiplyScalar(.5);mid.y+=2.2;
    p.m.position.set((1-t)*(1-t)*p.s.x+2*(1-t)*t*mid.x+t*t*p.e.x,(1-t)*(1-t)*p.s.y+2*(1-t)*t*mid.y+t*t*p.e.y,(1-t)*(1-t)*p.s.z+2*(1-t)*t*mid.z+t*t*p.e.z);
    p.m.rotation.y+=.12;p.m.rotation.z=Math.sin(t*6)*.2}
}

function startMission(key){
  S.key=key;S.m=MISSIONS[key];S.m._finished=false;S.i=-1;S.t=0;S.elapsed=0;S.rej=0;S.fails=0;S.tok=0;S.waiting=null;S.ev=[];S.askN={};S.prev=null;S.wt=[];S.redo=false;S.durMul=1;
  Object.values(AG).forEach(a=>{a.status='idle';a.thought='';a.ctx=.08;a.branch='main'});
  $('#asks').innerHTML='';$('#pane-time').innerHTML='';$('#pane-term').innerHTML='';$('#pane-diff').innerHTML='<div style="color:#64748b">Aún no hay cambios de código.</div>';$('#n-time').textContent=0;
  $('#modal').classList.remove('on');
  S.running=true;S.paused=false;$('#pause').innerHTML='<i class="fa-solid fa-pause"></i>';
  renderMission();renderAsks();renderRes();renderWts();drawWhiteboard();drawGit();
  log(`Misión «${S.m.title}» iniciada`,'info','lead');
  enterStep(0);
}

function enterStep(i,redo=false){
  const st=S.m.steps[i];S.i=i;S.t=0;S.ev=[];
  S.durMul=redo?.6:1;
  if(S.prev&&S.prev!==st.a){setStatus(S.prev,'idle');spawnPacket(S.prev,st.a)}
  S.prev=st.a;const a=AG[st.a];
  if(st.ask){
    S.dur=1;S.askN[i]=(S.askN[i]||0)+1;
    a.thought='Esperando tu aprobación…';setStatus(st.a,'waiting');setStatus('you','waiting');AG.you.thought='Tienes una decisión pendiente';
    S.waiting={step:st,i,n:S.askN[i]};renderAsks();SFX.ask();
    log(`solicita aprobación: ${st.ask.title}`,'ask');
    if(S.cine)goView('you');
    if(S.auto)setTimeout(()=>{if(S.waiting&&S.waiting.i===i)decide(true)},1400/S.speed);
  }else{
    S.dur=st.dur*S.durMul;setStatus(st.a,'working');a.thought=redo?'Replanificando con tu feedback…':(st.thought||st.label);
    log(redo?'replanifica tras tu rechazo':st.label,'info');
    // eventos programados
    const sched=(arr,fn)=>arr&&arr.forEach((x,k)=>S.ev.push({at:S.dur*(k+1)/(arr.length+1),fn:()=>fn(x)}));
    sched(st.log,t=>{log(t,t.toLowerCase().includes('fallo')?'bad':'info');AG[st.a].thought=t});
    sched(st.term,t=>term(t));
    if(st.diff){$('#pane-diff').innerHTML=`<div class="dfile"><i class="fa-solid fa-file-code"></i> ${esc(st.diff.file)}</div>`;sched(st.diff.lines,diffLine)}
    if(st.wt)applyWt(st.wt,st.a);
    S.ev.sort((x,y)=>x.at-y.at);
    if(S.cine)focusAgent(st.a);
  }
  setVramTargets();renderMission();drawWhiteboard();renderInspector();
}

function applyWt(w,agent){
  if(w.add){S.wt.push({name:w.add,status:w.status});AG[agent==='scout'?'forge':agent].branch=w.add;AG.scout.branch=w.add;AG.forge.branch=w.add}
  if(w.set){const x=S.wt.find(q=>q.name===w.set);if(x)x.status=w.status}
  if(w.merge){const x=S.wt.find(q=>q.name===w.merge);if(x)x.status='merged'}
  renderWts();drawGit();
}

function finishStep(){
  const st=cur(),a=AG[st.a];
  if(!st.ask){
    award(st.a,st.fail?st.xp-10:st.xp);a.tokens+=st.tok||0;a.tasks++;S.tok+=st.tok||0;a.ctx=clamp(a.ctx+(st.tok||2000)/70000,0,.95);
    if(a.prov==='claude')S.sub=clamp(S.sub+(st.tok||0)/900,0,100);
    if(st.fail){S.fails++;log('Tests fallidos: 1 de 12','bad');SFX.bad();burst(A3[st.a].group.position.clone().add(new THREE.Vector3(0,1.8,-.8)),'#e11d48',12,2)}
    else if(st.a==='sentinel'){log('Tests en verde','ok');burst(A3[st.a].group.position.clone().add(new THREE.Vector3(0,1.8,-.8)),'#10b981',16,2.6)}
  }
  if(S.i+1>=S.m.steps.length)completeMission();else enterStep(S.i+1,S.redo&&false);
}

function decide(ok,fb=''){
  const w=S.waiting;if(!w)return;S.waiting=null;
  const a=AG[w.step.a];setStatus('you','idle');setStatus(w.step.a,'idle');
  const b=press[ok?'ok':'no'];if(b){b.position.y=.89;setTimeout(()=>{b.position.y=.94},220)}
  histAdd(w.step.ask.title,ok,fb);
  if(ok){
    SFX.ok();log(`Tú aprobaste: ${w.step.ask.title}`,'ok','you');award('you',25);award(w.step.a,15);unlock('first');
    burst(A3.you.group.position.clone().add(new THREE.Vector3(0,2,-.8)),'#16a34a',18,2.8);
    if(S.i+1>=S.m.steps.length)completeMission();else enterStep(S.i+1);
  }else{
    SFX.no();S.rej++;log(`Tú rechazaste: ${w.step.ask.title}${fb?' — «'+fb+'»':''}`,'bad','you');unlock('strict');
    enterStep(w.step.ask.rejectTo,true);
  }
  renderAsks();
}

function completeMission(){
  S.m._finished=true;S.waiting=null;
  Object.values(AG).forEach(a=>{if(a.id!=='you')a.status='idle'});
  const stars=clamp(3-S.rej-(S.fails>0?1:0),1,3);S.done.add(S.key);
  award('lead',30);log('Misión completada','ok','lead');SFX.ok();
  [...Object.keys(A3)].forEach((id,k)=>setTimeout(()=>burst(A3[id].group.position.clone().add(new THREE.Vector3(0,2,-.6)),AG[id].color,22,3.6),k*160));
  unlock('noapi');if(S.fails===0)unlock('green');if(S.done.size>=3)unlock('hat');
  S.running=false;renderMission();drawWhiteboard();
  const next=Object.keys(MISSIONS).find(k=>!S.done.has(k))||S.key;
  $('#modal').innerHTML=`<div class="result"><div class="stars">${[1,2,3].map(n=>`<i class="fa-solid fa-star ${n<=stars?'on':''}"></i>`).join('')}</div>
    <h2>¡Misión completada!</h2><p>${esc(S.m.title)}</p>
    <div class="kv"><div><b>${mmss(S.elapsed)}</b><span>Tiempo</span></div><div><b>${fmt(S.tok)}</b><span>Tokens</span></div><div><b>${S.rej}</b><span>Rechazos</span></div><div><b>${S.fails}</b><span>Tests fallidos</span></div></div>
    <div class="row"><button class="btn" id="m-again"><i class="fa-solid fa-rotate-right"></i> Repetir</button><button class="btn primary" id="m-next"><i class="fa-solid fa-forward"></i> ${next===S.key?'Reiniciar':'Siguiente misión'}</button></div></div>`;
  setTimeout(()=>{$('#modal').classList.add('on');
    $('#m-again').onclick=()=>startMission(S.key);$('#m-next').onclick=()=>{$('#mission').value=next;startMission(next)}},900);
}

function tick(dt){
  if(!S.running||S.paused)return;
  S.elapsed+=dt;
  if(S.waiting)return;
  S.t+=dt;
  while(S.ev.length&&S.ev[0].at<=S.t)S.ev.shift().fn();
  const bar=document.querySelector('.step.active .bar span');if(bar)bar.style.width=clamp(S.t/S.dur*100,0,100)+'%';
  if(S.t>=S.dur)finishStep();
}

/* ---------- recursos simulados ---------- */
function setVramTargets(){
  const w=S.running&&!S.waiting&&S.i>=0?cur().a:null;
  S.vt.g0=8.4+(w==='scout'?3.2:0)+(w==='forge'?9.5:0);S.vt.g1=1.6+(w==='forge'?15.2:0);
  S.vt.u0=w==='scout'?72:w==='forge'?96:4;S.vt.u1=w==='forge'?91:2;
}
function updRes(dt){
  const k=1-Math.exp(-dt*2.5);['g0','g1','u0','u1'].forEach(x=>S.vram[x]+=(S.vt[x]-S.vram[x])*k);
  const w=S.running&&!S.paused&&!S.waiting&&S.i>=0&&!S.m._finished?cur().a:null;
  const target=!w?0:AG[w].prov==='claude'?70+Math.random()*25:34+Math.random()*16;S.tps+=(target-S.tps)*.15;
}
let resT=0;
function renderRes(){
  const c0=S.vram.g0/24,c1=S.vram.g1/24;
  const colr=v=>v>.85?'#ef4444':v>.6?'#f59e0b':'#22c55e';
  $('#g0-t').textContent=`${S.vram.g0.toFixed(1)}/24 GB · ${Math.round(S.vram.u0)}% · ${Math.round(38+S.vram.u0*.35)}°C`;$('#g0-b').style.width=c0*100+'%';$('#g0-b').style.background=colr(c0);
  $('#g1-t').textContent=`${S.vram.g1.toFixed(1)}/24 GB · ${Math.round(S.vram.u1)}% · ${Math.round(36+S.vram.u1*.35)}°C`;$('#g1-b').style.width=c1*100+'%';$('#g1-b').style.background=colr(c1);
  $('#sub-t').textContent=Math.round(S.sub)+'%';$('#sub-b').style.width=S.sub+'%';
  $('#tps').textContent=Math.round(S.tps)+' tok/s';$('#k-tok').textContent=fmt(S.tok);
  const cv=$('#spark'),g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height);
  g.beginPath();S.series.forEach((v,i)=>{const x=i/(S.series.length-1)*cv.width,y=cv.height-2-v/100*(cv.height-6);i?g.lineTo(x,y):g.moveTo(x,y)});
  g.strokeStyle='#5b5bf0';g.lineWidth=2;g.lineJoin='round';g.stroke();g.lineTo(cv.width,cv.height);g.lineTo(0,cv.height);g.fillStyle='rgba(91,91,240,.1)';g.fill();
  setLeds();
}

  AGENT_CFG.forEach(c=>{const a=AG[c.id],L=LB[c.id];_v.set(c.pos[0],2.95,c.pos[2]-.8).project(camera);

function animate(){
  requestAnimationFrame(animate);
  const rdt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime,dt=rdt*S.speed;
  tick(dt);updRes(rdt);updPackets(rdt);updParts(rdt);
  if(camGoal){camera.position.lerp(camGoal,.07);controls.target.lerp(targetGoal,.07);if(camera.position.distanceTo(camGoal)<.08){camGoal=null;targetGoal=null}}
  // animación de personajes
  AGENT_CFG.forEach((c,i)=>{const A=AG[c.id],X=A3[c.id],ch=X.char,st=A.status;
    const busy=st==='working';
    ch.L.rotation.x+=(((busy?-1.15+Math.sin(t*14+i)*.12:-.85+Math.sin(t*1.5+i)*.03))-ch.L.rotation.x)*.2;
    const rt=st==='waiting'?Math.PI*.92+Math.sin(t*7)*.12:(busy?-1.15+Math.cos(t*16+i)*.12:-.85+Math.sin(t*1.6+i)*.03);
    ch.R.rotation.x+=(rt-ch.R.rotation.x)*.18;ch.R.rotation.z+=(((st==='waiting')?-.25+Math.sin(t*7)*.25:0)-ch.R.rotation.z)*.2;
    ch.head.rotation.y=Math.sin(t*1.2+i*1.7)*(busy?.06:.22);ch.head.rotation.x=busy?.12:Math.sin(t*.9+i)*.04;
    ch.root.position.y=.6+(st==='idle'?Math.sin(t*1.8+i)*.012:0);
    // gema y anillo
    const on=st!=='idle';X.gem.visible=on;X.gem.rotation.y=t*2;X.gem.position.y=2.55+Math.sin(t*3)*.07;
    X.gem.material.color.set(st==='waiting'?'#f59e0b':c.color);X.gem.material.emissive.set(st==='waiting'?'#f59e0b':c.color);
    X.ring.material.opacity+=((on?(.35+Math.sin(t*4)*.15):0)-X.ring.material.opacity)*.15;
    X.scr.material.color.set(busy?c.color:'#cbd5e1');X.logo.material.color.set(busy?'#ffffff':c.color);
  });
  if(beacon){const pend=!!S.waiting;beacon.material.emissiveIntensity=pend?.6+Math.sin(t*8)*.5:.15;beacon.userData.light.intensity=pend?1.8+Math.sin(t*8):0;beacon.rotation.y=t*3}
  Object.values(links).forEach(k=>{k.flash=Math.max(0,k.flash-rdt*.5);k.line.material.color.set(k.flash>0?k.c:'#94a3b8')});
  const spin=(S.vram.u0+S.vram.u1)/200;rack.fans.forEach((f,i)=>{f.rotation.x+=.05+spin*.5});
  resT+=rdt;if(resT>.2){resT=0;S.series.push(S.tps);S.series.shift();renderRes()}
  updLabels();controls.update();renderer.render(scene,camera);
}

  $('#pause').onclick=()=>setPause(!S.paused);
  $('#speed').onclick=()=>{S.speed=S.speed===1?2:S.speed===2?4:1;$('#speed').textContent=S.speed+'x'};
  $('#auto').onchange=e=>{S.auto=e.target.checked;if(S.auto&&S.waiting)setTimeout(()=>decide(true),600)};
  $('#cine').onchange=e=>{S.cine=e.target.checked};
  $('#btn-audio').onclick=()=>{SFX.on=!SFX.on;$('#audio-i').className='fa-solid '+(SFX.on?'fa-volume-high':'fa-volume-xmark')};
  $('#btn-ui').onclick=()=>{document.body.classList.toggle('ui-hidden');setTimeout(onResize,50)};
  $('#btn-ach').onclick=()=>$('#ach-pop').classList.toggle('on');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
    document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+t.dataset.tab))});
  $('#dock-toggle').onclick=()=>{$('#dock').classList.toggle('min');$('#dock-toggle i').className='fa-solid '+($('#dock').classList.contains('min')?'fa-chevron-up':'fa-chevron-down');setTimeout(onResize,300)};
  window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const k=e.key.toLowerCase();
    if(k===' '){e.preventDefault();setPause(!S.paused)}else if(k==='a'&&S.waiting)decide(true);else if(k==='r'&&S.waiting)decide(false);else if(k==='h')$('#btn-ui').click()});
  document.addEventListener('click',e=>{if(!e.target.closest('#ach-pop,#btn-ach'))$('#ach-pop').classList.remove('on')});
  renderTop();renderAch();renderInspector();renderRes();renderWts();renderAsks();
  animate();
  setTimeout(()=>startMission('scraper'),700);
  window.__S=S;window.__decide=decide;
});
</script>
</body>
</html>
